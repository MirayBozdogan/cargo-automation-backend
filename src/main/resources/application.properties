spring.application.name=staj1
spring.config.import=optional:file:.env.local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Şemayı Flyway kurar (db/migration). Hibernate yalnız entity'lerin şemayla uyumunu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Flyway'den önce ddl-auto=update ile oluşmuş dolu bir veritabanı V1 olarak kabul edilir; V1 tekrar çalışmaz.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}

# Frontend adresleri virgülle ayrılır; çerezli istekler yalnız bu kaynaklardan kabul edilir.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Oturum çerezi. HTTPS kullanılan ortamda AUTH_COOKIE_SECURE=true olmalıdır.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# Şifre sıfırlama e-postası. Yerelde Mailpit kullanılır (SMTP 1025, gelen kutusu http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@cargo-automation.local}
# E-postadaki bağlantı bu adrese ?token=... eklenerek oluşturulur (frontend sayfası).
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
