# Geliştirme profili: Flyway şemadan sonra db/dev içindeki örnek verileri yükler.
# R__ ile başlayan dosyalar tekrar çalıştırılabilir; mevcut kayıtları çoğaltmaz veya değiştirmez.
# Örnek veriler yalnız cargo_automation_dev veritabanında çalışır.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Opt-in: credentials are supplied locally, never committed.
app.dev-admin.enabled=${DEV_ADMIN_ENABLED:false}
app.dev-admin.email=${DEV_ADMIN_EMAIL:}
app.dev-admin.password=${DEV_ADMIN_PASSWORD:}
