# Explicit development profile; seed runs after Hibernate creates tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:dev-data.sql

# Opt-in: credentials are supplied locally, never committed.
app.dev-admin.enabled=${DEV_ADMIN_ENABLED:false}
app.dev-admin.email=${DEV_ADMIN_EMAIL:}
app.dev-admin.password=${DEV_ADMIN_PASSWORD:}
