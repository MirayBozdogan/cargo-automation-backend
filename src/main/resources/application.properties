spring.application.name=staj1
spring.config.import=optional:file:.env.local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Şemayı Flyway kurar (db/migration). Hibernate yalnız entity'lerin şemayla uyumunu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Flyway'den önce ddl-auto=update ile oluşmuş dolu bir veritabanı V1 olarak kabul edilir; V1 tekrar çalışmaz.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}

# Frontend adresleri virgülle ayrılır; çerezli istekler yalnız bu kaynaklardan kabul edilir.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Oturum çerezi. HTTPS kullanılan ortamda AUTH_COOKIE_SECURE=true olmalıdır.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
